# Publica o Worker sozinho, a cada mudança nele em main.
#
# Existe por causa de um erro real: o deploy era feito à mão a partir de
# uma cópia local sem git, e num dia essa cópia estava três semanas
# atrasada. O `wrangler deploy` publicou fielmente um cf_proxy.js anterior
# às URLs assinadas — a verificação de assinatura sumiu de produção e
# ninguém teria notado, porque tudo continuou tocando.
#
# Uma cópia local sempre acaba desatualizando. O que não desatualiza é o
# que está no repositório.
name: publica o worker

on:
  push:
    branches: [main]
    # Só quando o Worker muda de fato. Um commit no Python não precisa
    # republicar a borda que entrega vídeo.
    paths:
      - cf_proxy.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  # Para republicar sem precisar de um commit — por exemplo, depois de
  # trocar um secret.
  workflow_dispatch:

# Duas publicações ao mesmo tempo poderiam terminar fora de ordem e
# deixar a versão antiga por cima.
concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # O portão. Publicar um Worker que não passa nos próprios testes é
      # justamente o que este arquivo existe para impedir.
      - name: testes do worker
        run: node --test tests/cf_proxy.test.mjs

      # Sem isto, um secret ausente falha com um erro do wrangler que fala
      # de "ambiente nao interativo" e nao diz onde criar o que falta.
      - name: conferir o segredo
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error title=Falta o CLOUDFLARE_API_TOKEN::O segredo nao existe neste repositorio, entao o Worker nao pode ser publicado."
            echo ""
            echo "Como resolver, uma vez so:"
            echo "  1. Cloudflare -> My Profile -> API Tokens -> Create Token"
            echo "  2. Template 'Edit Cloudflare Workers'"
            echo "  3. https://github.com/${{ github.repository }}/settings/secrets/actions/new"
            echo "     Nome:  CLOUDFLARE_API_TOKEN"
            echo "     Valor: o token copiado"
            echo ""
            echo "Precisa ser um secret de ACTIONS do repositorio - um secret"
            echo "de environment nao e visto por um job que nao declara"
            echo "'environment:', e e um engano facil de cometer."
            exit 1
          fi

      - name: publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Os secrets do Worker (TOKEN_ENDPOINT_SECRET) NÃO são tocados
          # por um deploy: eles persistem. Só as vars do wrangler.toml
          # sobem junto.
