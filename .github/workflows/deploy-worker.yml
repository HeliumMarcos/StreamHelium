name: deploy worker

# The Vercel deploy only covers the addon. The Cloudflare Worker is a
# separate deploy, and doing it by hand in the dashboard is how the live
# code drifted away from this repo in the first place. Now a push that
# touches the Worker publishes it.

on:
  push:
    branches: [main]
    paths:
      - cf_proxy.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
