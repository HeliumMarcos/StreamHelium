name = "stream-helium-proxy"
main = "cf_proxy.js"
compatibility_date = "2026-07-28"
workers_dev = true

# Not a credential - this is the same identifier that appears in every
# Cloudflare dashboard URL. The API token is what's secret, and it lives in
# the CLOUDFLARE_API_TOKEN GitHub secret, never here.
account_id = "351cda8f3188c85575206e1cf25bfd4e"

# Sends console.log/console.error to Workers Logs. Without this, a failing
# request shows up as a bare status code with no reason attached.
[observability]
enabled = true

[vars]
# Where the Worker asks for a Drive access token, so it doesn't have to
# keep its own copy of the refresh tokens. Safe to point here before the
# addon side is finished: while this endpoint fails, the Worker logs the
# reason and falls back to the ACCOUNTS secret, and only stops falling
# back once ACCOUNTS is deleted.
TOKEN_ENDPOINT = "https://stream-helium.vercel.app/internal/drive-token"

# Refuse playback URLs that carry no signature.
#
# This was "false" during the rollout of signed URLs, so that a player
# mid-film - or one holding a stream list cached from before the change -
# wouldn't be cut off. That window is over: every URL the addon hands out
# now carries a signature and an expiry.
#
# With this on, a leaked playback link dies on its own, and nobody can
# craft one for a different file. That is the entire point of signing, and
# it does nothing while unsigned URLs are still accepted.
#
# The only cost of flipping it: anyone still holding a pre-signing link
# has playback stop, and gets it back by reopening the title.
REQUIRE_SIGNED_URLS = "true"

# Secrets are NOT declared here and are NOT touched by `wrangler deploy` -
# they persist across deploys. Set them once:
#   npx wrangler secret put TOKEN_ENDPOINT_SECRET
