{% if password_error %}
  <div class="message error" id="password-error" role="alert">
    As senhas precisam ser iguais e ter pelo menos 6 caracteres.
  </div>
{% endif %}
<form method="post" action="/connect/{{ invite_token }}/set-password" class="stack">
  <div class="field">
    <label for="new-password">Nova senha</label>
    <input id="new-password" type="password" name="password" minlength="6"
           autocomplete="new-password" required
           {% if password_error %}aria-describedby="password-error"{% endif %}>
    <span class="hint">Use pelo menos 6 caracteres.</span>
  </div>
  <div class="field">
    <label for="confirm-password">Confirmar nova senha</label>
    <input id="confirm-password" type="password" name="confirm" minlength="6"
           autocomplete="new-password" required
           {% if password_error %}aria-describedby="password-error"{% endif %}>
  </div>
  <button type="submit">Salvar senha</button>
</form>
